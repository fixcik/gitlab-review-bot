# Minimal single-binary Tempo for the local stand (profile "tracing" in
# e2e/local/docker-compose.yml): OTLP receivers, local block storage, no
# metrics generator. The bot exports OTLP/HTTP JSON to :4318.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
        grpc:
          endpoint: "0.0.0.0:4317"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
