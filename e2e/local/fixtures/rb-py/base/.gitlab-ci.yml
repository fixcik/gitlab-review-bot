# Coverage for reviewbot (docs/features/coverage.md): job "tests" publishes
# coverage.xml (Cobertura) as an artifact, and a JUnit report (the CI failure
# digest, docs/features/ci.md, reads failed tests from the pipeline's test report). Linter for reviewbot
# (docs/features/lint.md, lint.ci): job "ruff" publishes a GitLab Code Quality
# report (and the same findings as SARIF for scenario K4).
stages: [test]

tests:
  stage: test
  image: python:3.12-slim
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  script:
    - pip install --quiet pytest pytest-cov
    - pytest --cov --cov-report=xml:coverage.xml --cov-report=term --junitxml=report.xml
  coverage: '/^TOTAL.+?(\d+%)$/'
  artifacts:
    when: always
    expire_in: 7 days
    paths: [coverage.xml]
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

ruff:
  stage: test
  image: python:3.12-slim
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  script:
    - pip install --quiet ruff
    - ruff check --output-format=gitlab --output-file=ruff.json . || true
    - ruff check --output-format=sarif --output-file=ruff.sarif . || true
  artifacts:
    when: always
    expire_in: 7 days
    paths: [ruff.json, ruff.sarif]   # paths too: GitLab < 19.4 cannot download the report by type
    reports:
      codequality: ruff.json
