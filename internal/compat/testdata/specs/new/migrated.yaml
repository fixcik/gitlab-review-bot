openapi: 3.0.3
info: {title: Orders, version: "2.0"}
servers:
  - url: /api
paths:
  /orders:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency]
              properties:
                currency: {type: string}
                comment: {type: string}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: string}
